%YAML 1.1
---
vars:
  address-groups:
    HOME_NET: "[192.168.10.0/24]"
    EXTERNAL_NET: "!$HOME_NET"

default-log-dir: /var/log/suricata

outputs:
  - fast:
      enabled: yes
      filename: fast.log
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert:
            payload: yes
            packet: yes
        - modbus

app-layer:
  protocols:
    modbus:
      enabled: yes
      detection-ports:
        dp: 502

default-rule-path: /var/lib/suricata/rules
rule-files:
  - modbus.rules
